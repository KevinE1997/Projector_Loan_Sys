name: CI - Projector Loan System

# When is it triggered?
on:
  push:
    branches: [ main, qa ]
  pull_request:
    branches: [ main, qa ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install PNPM
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 4. Install project dependencies
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 5. Verify syntax (Linting)
      - name: Lint All Apps
        run: npx nx run-many --target=lint --all --parallel=3

      # 6. Build Everything (Build)
      - name: Build All Apps
        run: npx nx run-many --target=build --all --parallel=3

      # 7. Run Unit Tests
      - name: Run Unit Tests
        run: npx nx run-many --target=test --all --parallel=3