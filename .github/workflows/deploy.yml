name: PLMS Master Pipeline (PNPM + Nx)

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY_URL: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  # Importante para Nx:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  validate-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          identity-service, loan-service, inventory-service, 
          feedback-service, penalty-service, maintenance-service,
          audit-service, notification-service
        ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Importante para que Nx detecte cambios (affected)

      # 1. INSTALAR PNPM
      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10

      # 2. INSTALAR NODE.JS
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'pnpm'

      # 3. INSTALAR DEPENDENCIAS (Usando tu pnpm-lock.yaml)
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # --- ETAPA DE CALIDAD (Nx + PNPM) ---
      
      - name: Lint ${{ matrix.service }}
        run: npx nx lint ${{ matrix.service }}

      - name: Test ${{ matrix.service }}
        run: npx nx test ${{ matrix.service }}

      # --- ETAPA DE AWS ---

      - name: Configure AWS Credentials (Account 1)
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          REPO_NAME=plms-${{ matrix.service }}
          # Nota: Usamos el Dockerfile relativo a la raíz
          docker build -t $ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG -f apps/${{ matrix.service }}/Dockerfile .
          docker push $ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG

  # ------------------------------------------------------------------
  # JOB 2: DESPLEGAR EN CUENTA 2 (CORE SERVICES)
  # ------------------------------------------------------------------
  deploy-core:
    needs: validate-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Account 2 EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.CORE_HOST }}
          username: ${{ secrets.CORE_USERNAME }}
          key: ${{ secrets.CORE_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION
          script: |
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
            export AWS_REGION=us-east-1
            
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
            REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

            # Identity
            docker pull $REGISTRY/plms-identity-service:latest
            docker stop identity-service || true
            docker rm identity-service || true
            docker run -d --name identity-service -p 3000:3000 --env-file .env $REGISTRY/plms-identity-service:latest

            # Inventory
            docker pull $REGISTRY/plms-inventory-service:latest
            docker stop inventory-service || true
            docker rm inventory-service || true
            docker run -d --name inventory-service -p 3002:3002 --env-file .env $REGISTRY/plms-inventory-service:latest

            # Loan
            docker pull $REGISTRY/plms-loan-service:latest
            docker stop loan-service || true
            docker rm loan-service || true
            docker run -d --name loan-service -p 3004:3004 --env-file .env $REGISTRY/plms-loan-service:latest

  # ------------------------------------------------------------------
  # JOB 3: DESPLEGAR EN CUENTA 3 (SUPPORT SERVICES)
  # ------------------------------------------------------------------
  deploy-support:
    needs: validate-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Account 3 EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SUPPORT_HOST }}
          username: ${{ secrets.SUPPORT_USERNAME }}
          key: ${{ secrets.SUPPORT_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION
          script: |
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
            export AWS_REGION=us-east-1
            
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
            REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

            # Notification
            docker pull $REGISTRY/plms-notification-service:latest
            docker stop notification-service || true
            docker rm notification-service || true
            docker run -d --name notification-service -p 3006:3006 --env-file .env $REGISTRY/plms-notification-service:latest

            # Feedback
            docker pull $REGISTRY/plms-feedback-service:latest
            docker stop feedback-service || true
            docker rm feedback-service || true
            docker run -d --name feedback-service -p 3008:3008 --env-file .env $REGISTRY/plms-feedback-service:latest
            
            # Maintenance
            docker pull $REGISTRY/plms-maintenance-service:latest
            docker stop maintenance-service || true
            docker rm maintenance-service || true
            docker run -d --name maintenance-service -p 3010:3010 --env-file .env $REGISTRY/plms-maintenance-service:latest

            # Penalty
            docker pull $REGISTRY/plms-penalty-service:latest
            docker stop penalty-service || true
            docker rm penalty-service || true
            docker run -d --name penalty-service -p 3016:3016 --env-file .env $REGISTRY/plms-penalty-service:latest